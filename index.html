<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonidos de los Animales - Retro Pixel</title>

  <!-- Fuente Retro Pixel Art -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --pixel-yellow: #ffcc00;
      --pixel-amber: #ff9800;
      --pixel-green: #38b764;
      --pixel-red: #ff0055;
      --pixel-cyan: #00f0ff;
      --ui-dark: rgba(14, 16, 27, 0.9);
      --ui-border: #000000;
      --text-main: #f4f4f4;
      --shadow-block: 4px 4px 0px #000000;
      --shadow-block-lg: 6px 6px 0px #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      color: var(--text-main);
      background-color: #04040c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo Nebulosa Carina en Pixel Art */
    #spaceCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Títulos pixel art amarillos */
    h1, h2, .pixel-title {
      font-family: 'Press Start 2P', monospace !important;
      color: var(--pixel-yellow) !important;
      text-shadow: 3px 3px 0px #000000 !important;
      letter-spacing: -0.05em;
    }

    h1 {
      font-size: 1.4rem;
      line-height: 1.5;
    }

    h2 {
      font-size: 0.8rem;
      line-height: 1.6;
      margin-bottom: 0.8rem;
    }

    nav {
      display: flex;
      gap: 12px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-btn {
      font-family: inherit;
      padding: 10px 16px;
      font-size: 0.65rem;
      border: 3px solid var(--ui-border);
      cursor: pointer;
      background-color: var(--ui-dark);
      color: var(--text-main);
      box-shadow: var(--shadow-block);
      transition: none;
    }

    .nav-btn:hover {
      background-color: var(--pixel-amber);
      color: #000;
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-block-lg);
    }

    .nav-btn.active {
      background-color: var(--pixel-yellow);
      color: #000;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    .instance-container {
      width: 100%;
      max-width: 600px;
      background: var(--ui-dark);
      border: 4px solid var(--ui-border);
      padding: 24px;
      box-shadow: var(--shadow-block-lg);
      display: none;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .instance-container.active {
      display: flex;
    }

    /* Instancia 1: Exploración */
    .carousel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .animal-card {
      width: 100%;
      max-width: 320px;
      height: 290px;
      border: 4px solid var(--ui-border);
      overflow: hidden;
      box-shadow: var(--shadow-block);
      cursor: pointer;
      position: relative;
      background: #090a12;
    }

    .animal-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-block-lg);
    }

    .animal-card img {
      width: 100%;
      height: 75%;
      object-fit: cover;
      display: block;
      border-bottom: 4px solid var(--ui-border);
    }

    .animal-card .name {
      height: 25%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      background-color: #10121c;
      color: var(--pixel-cyan);
      text-shadow: 2px 2px 0px #000;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 24px;
      gap: 8px;
    }

    .btn {
      font-family: inherit;
      padding: 10px 14px;
      border: 3px solid var(--ui-border);
      background-color: var(--pixel-amber);
      color: #000;
      font-size: 0.65rem;
      cursor: pointer;
      box-shadow: var(--shadow-block);
    }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-block-lg);
      background-color: var(--pixel-yellow);
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .sound-btn {
      background-color: var(--pixel-green);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Instancia 2: Adivinar */
    .game-header {
      width: 100%;
      text-align: center;
      margin-bottom: 15px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      margin-top: 15px;
    }

    .option-card {
      height: 140px;
      border: 4px solid var(--ui-border);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow-block);
      background: #090a12;
    }

    .option-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-block-lg);
    }

    .option-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .option-card.correct {
      border-color: var(--pixel-green);
      box-shadow: 0 0 0 4px var(--pixel-green);
    }

    .option-card.wrong {
      border-color: var(--pixel-red);
      opacity: 0.4;
    }

    .feedback {
      min-height: 28px;
      margin-top: 20px;
      font-size: 0.65rem;
      line-height: 1.6;
      text-align: center;
      text-shadow: 2px 2px 0px #000;
    }

    .progress {
      font-size: 0.6rem;
      color: var(--pixel-cyan);
      margin-top: 8px;
      text-shadow: 1px 1px 0px #000;
    }

    .subtext {
      font-size: 0.55rem;
      line-height: 1.8;
      color: #94a3b8;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Lienzo fondo cósmico pixel art -->
  <canvas id="spaceCanvas"></canvas>

  <header>
    <h1>🔊 SONIDOS DE LOS ANIMALES</h1>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchInstance(1)">1: Explorar</button>
    <button class="nav-btn" onclick="switchInstance(2)">2: Adivinar</button>
  </nav>

  <!-- INSTANCIA 1: EXPLORACIÓN -->
  <div id="instance1" class="instance-container active">
    <p class="subtext">HAZ CLIC EN LA IMAGEN O USA LOS BOTONES PARA REPRODUCIR:</p>
    
    <div class="carousel">
      <div class="animal-card" onclick="playCurrentSound()">
        <img id="exp-img" src="" alt="Animal">
        <div class="name" id="exp-name">CARGANDO...</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="prevAnimal()">◀ ATRÁS</button>
      <button class="btn sound-btn" onclick="playCurrentSound()">► SONAR</button>
      <button class="btn" onclick="nextAnimal()">SIG ▶</button>
    </div>
  </div>

  <!-- INSTANCIA 2: JUEGO -->
  <div id="instance2" class="instance-container">
    <div class="game-header">
      <h2>¿QUÉ ANIMAL HACE ESTE SONIDO?</h2>
      <div class="progress" id="game-progress">ADIVINADOS: 0 / 8</div>
    </div>

    <button class="btn sound-btn" style="margin-bottom: 10px;" onclick="playTargetSound()">
      ► REPETIR SONIDO
    </button>

    <div class="options-grid" id="options-grid"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    /* ========================================================
       FONDO PIXEL ART: NEBULOSA CARINA (JWST)
       ======================================================== */
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    const W = 320;
    const H = 180;
    canvas.width = W;
    canvas.height = H;

    function renderNebula() {
      // 1. Gradiente del cosmos
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.7);
      skyGrad.addColorStop(0, '#04040c');
      skyGrad.addColorStop(0.3, '#08112b');
      skyGrad.addColorStop(0.7, '#0f3254');
      skyGrad.addColorStop(1, '#1b5a7a');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      // 2. Gas y polvo cósmico
      for (let i = 0; i < 400; i++) {
        const x = Math.floor(Math.random() * W);
        const y = Math.floor(Math.random() * (H * 0.65));
        ctx.fillStyle = Math.random() > 0.4 ? 'rgba(34, 130, 175, 0.25)' : 'rgba(235, 130, 60, 0.15)';
        ctx.fillRect(x, y, 2, 2);
      }

      // 3. Estrellas con picos de difracción del James Webb
      const webbStars = [
        {x: 60, y: 35, s: 2, c: '#ffed75'},
        {x: 240, y: 40, s: 3, c: '#ffffff'},
        {x: 180, y: 20, s: 1, c: '#8cedff'},
        {x: 290, y: 70, s: 2, c: '#ffc857'},
        {x: 120, y: 65, s: 1, c: '#ffffff'},
        {x: 30, y: 80, s: 1, c: '#ffaa44'}
      ];

      webbStars.forEach(st => {
        ctx.fillStyle = st.c;
        ctx.fillRect(st.x - st.s, st.y - st.s, st.s * 2, st.s * 2);
        for (let r = 1; r <= st.s * 4; r++) {
          ctx.fillRect(st.x + r, st.y, 1, 1);
          ctx.fillRect(st.x - r, st.y, 1, 1);
          ctx.fillRect(st.x, st.y + r, 1, 1);
          ctx.fillRect(st.x, st.y - r, 1, 1);
          if (r % 2 === 0) {
            ctx.fillRect(st.x + r/2, st.y + r/2, 1, 1);
            ctx.fillRect(st.x - r/2, st.y - r/2, 1, 1);
            ctx.fillRect(st.x + r/2, st.y - r/2, 1, 1);
            ctx.fillRect(st.x - r/2, st.y + r/2, 1, 1);
          }
        }
      });

      // Estrellas menores
      for (let s = 0; s < 120; s++) {
        ctx.fillStyle = Math.random() > 0.3 ? '#ffffff' : '#ffd085';
        ctx.fillRect(Math.floor(Math.random() * W), Math.floor(Math.random() * (H * 0.7)), 1, 1);
      }

      // 4. Riscos dorados / Cosmic Cliffs
      function getMountainHeight(x) {
        return Math.sin(x * 0.02) * 18 + 
               Math.cos(x * 0.05) * 10 + 
               Math.sin(x * 0.1) * 4 + 
               (H * 0.52);
      }

      for (let x = 0; x < W; x++) {
        const peakY = Math.floor(getMountainHeight(x));
        for (let y = peakY; y < H; y++) {
          const depth = y - peakY;
          if (depth === 0) {
            ctx.fillStyle = (x % 3 === 0) ? '#fff5cc' : '#fca311';
          } else if (depth < 4) {
            ctx.fillStyle = '#e85d04';
          } else if (depth < 10) {
            ctx.fillStyle = '#dc2f02';
          } else if (depth < 22) {
            ctx.fillStyle = '#9d0208';
          } else if (depth < 45) {
            ctx.fillStyle = '#370617';
          } else {
            ctx.fillStyle = '#140207';
          }

          if (depth === 2 || depth === 6 || depth === 14 || depth === 28) {
            if ((x + y) % 2 === 0) ctx.fillStyle = '#03071e';
          }

          ctx.fillRect(x, y, 1, 1);
        }
      }
    }

    renderNebula();

    /* ========================================================
       LÓGICA DEL JUEGO DE ANIMALES
       ======================================================== */
    const ANIMALS = [
      {
        id: 'perro',
        name: 'Perro',
        image: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=600&q=80',
        sound: 'perro.wav'
      },
      {
        id: 'gato',
        name: 'Gato',
        image: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&q=80',
        sound: 'gato.wav'
      },
      {
        id: 'oveja',
        name: 'Oveja',
        image: 'https://images.unsplash.com/photo-1484557985045-edf25e08da73?auto=format&fit=crop&w=600&q=80',
        sound: 'oveja.wav'
      },
      {
        id: 'leon',
        name: 'León',
        image: 'https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?auto=format&fit=crop&w=600&q=80',
        sound: 'leon.wav'
      },
      {
        id: 'pollito',
        name: 'Pollito',
        image: 'https://images.unsplash.com/photo-1563281577-a7be47e20db9?auto=format&fit=crop&w=600&q=80',
        sound: 'pollito.wav'
      },
      {
        id: 'gallina',
        name: 'Gallina',
        image: 'https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?auto=format&fit=crop&w=600&q=80',
        sound: 'gallina.wav'
      },
      {
        id: 'vaca',
        name: 'Vaca',
        image: 'https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=600&q=80',
        sound: 'vaca.wav'
      },
      {
        id: 'cerdo',
        name: 'Cerdo',
        image: 'https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=600&q=80',
        sound: 'cerdo.wav'
      }
    ];

    let currentAudio = null;

    // Instancia 1
    let currentIndex = 0;

    function updateExplorer() {
      const animal = ANIMALS[currentIndex];
      document.getElementById('exp-img').src = animal.image;
      document.getElementById('exp-name').textContent = animal.name.toUpperCase();
    }

    function playCurrentSound() {
      playSound(ANIMALS[currentIndex].sound);
    }

    function nextAnimal() {
      currentIndex = (currentIndex + 1) % ANIMALS.length;
      updateExplorer();
      playCurrentSound();
    }

    function prevAnimal() {
      currentIndex = (currentIndex - 1 + ANIMALS.length) % ANIMALS.length;
      updateExplorer();
      playCurrentSound();
    }

    // Instancia 2
    let remainingAnimals = [];
    let currentTarget = null;
    let isBlockClicked = false;
    let score = 0;

    function initGame() {
      remainingAnimals = [...ANIMALS];
      score = 0;
      nextRound();
    }

    function nextRound() {
      isBlockClicked = false;
      document.getElementById('feedback').textContent = '';
      
      if (remainingAnimals.length === 0) {
        document.getElementById('feedback').innerHTML = '★ ¡RONDA COMPLETADA! ★';
        document.getElementById('feedback').style.color = 'var(--pixel-yellow)';
        setTimeout(() => {
          initGame();
        }, 3000);
        return;
      }

      document.getElementById('game-progress').textContent = `ADIVINADOS: ${score} / ${ANIMALS.length}`;

      const targetIndex = Math.floor(Math.random() * remainingAnimals.length);
      currentTarget = remainingAnimals[targetIndex];

      const otherAnimals = ANIMALS.filter(a => a.id !== currentTarget.id);
      const shuffledOthers = [...otherAnimals].sort(() => 0.5 - Math.random());
      const options = [currentTarget, ...shuffledOthers.slice(0, 3)].sort(() => 0.5 - Math.random());

      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';
      
      options.forEach(animal => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.innerHTML = `<img src="${animal.image}" alt="${animal.name}">`;
        card.onclick = () => checkAnswer(animal, card);
        grid.appendChild(card);
      });

      setTimeout(() => {
        playTargetSound();
      }, 300);
    }

    function playTargetSound() {
      if (currentTarget) {
        playSound(currentTarget.sound);
      }
    }

    function checkAnswer(selectedAnimal, cardElement) {
      if (isBlockClicked) return;

      if (selectedAnimal.id === currentTarget.id) {
        isBlockClicked = true;
        cardElement.classList.add('correct');
        document.getElementById('feedback').textContent = '✔ ¡CORRECTO!';
        document.getElementById('feedback').style.color = 'var(--pixel-green)';
        
        remainingAnimals = remainingAnimals.filter(a => a.id !== currentTarget.id);
        score++;

        setTimeout(() => {
          nextRound();
        }, 1200);
      } else {
        cardElement.classList.add('wrong');
        document.getElementById('feedback').textContent = '✖ INTENTA OTRA VEZ';
        document.getElementById('feedback').style.color = 'var(--pixel-red)';
      }
    }

    function playSound(url) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = new Audio(url);
      currentAudio.play().catch(e => console.log('Esperando interacción o audio no disponible:', e));
    }

    function switchInstance(instanceNum) {
      if (currentAudio) currentAudio.pause();

      const btn1 = document.querySelectorAll('.nav-btn')[0];
      const btn2 = document.querySelectorAll('.nav-btn')[1];
      const inst1 = document.getElementById('instance1');
      const inst2 = document.getElementById('instance2');

      if (instanceNum === 1) {
        btn1.classList.add('active');
        btn2.classList.remove('active');
        inst1.classList.add('active');
        inst2.classList.remove('active');
        updateExplorer();
      } else {
        btn2.classList.add('active');
        btn1.classList.remove('active');
        inst2.classList.add('active');
        inst1.classList.remove('active');
        initGame();
      }
    }

    updateExplorer();
  </script>
</body>
</html>
