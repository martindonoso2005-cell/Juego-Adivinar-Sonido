<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonidos de los Animales</title>
  <style>
    :root {
      --primary: #4CAF50;
      --primary-dark: #388E3C;
      --secondary: #FF9800;
      --bg-color: #f0f8ff;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background-color: #e0e0e0;
      color: #666;
      transition: all 0.3s ease;
    }

    .nav-btn.active {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    .instance-container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .instance-container.active {
      display: flex;
    }

    /* --- INSTANCIA 1: EXPLORAR --- */
    .carousel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .animal-card {
      width: 100%;
      max-width: 320px;
      height: 280px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
      background: #fafafa;
    }

    .animal-card:hover {
      transform: scale(1.03);
    }

    .animal-card img {
      width: 100%;
      height: 80%;
      object-fit: cover;
    }

    .animal-card .name {
      height: 20%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      background-color: #fff;
      color: var(--primary-dark);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background-color: var(--secondary);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      filter: brightness(0.9);
    }

    .sound-btn {
      background-color: var(--primary);
      padding: 12px 25px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- INSTANCIA 2: JUEGO --- */
    .game-header {
      width: 100%;
      text-align: center;
      margin-bottom: 15px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      margin-top: 15px;
    }

    .option-card {
      height: 140px;
      border-radius: 12px;
      overflow: hidden;
      border: 4px solid transparent;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, border-color 0.2s;
    }

    .option-card:hover {
      transform: scale(1.02);
    }

    .option-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .option-card.correct {
      border-color: #4CAF50;
      animation: pulse 0.5s;
    }

    .option-card.wrong {
      border-color: #F44336;
      opacity: 0.5;
    }

    .feedback {
      min-height: 30px;
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
    }

    .progress {
      font-size: 0.9rem;
      color: #666;
      margin-top: 5px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header>
    <h1>🔊 Sonidos de los Animales</h1>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchInstance(1)">Instancia 1: Explorar</button>
    <button class="nav-btn" onclick="switchInstance(2)">Instancia 2: Adivinar</button>
  </nav>

  <!-- INSTANCIA 1: EXPLORACIÓN -->
  <div id="instance1" class="instance-container active">
    <p style="margin-bottom: 15px; color: #666;">Haz clic en la imagen o usa los botones para escuchar el sonido:</p>
    
    <div class="carousel">
      <div class="animal-card" onclick="playCurrentSound()">
        <img id="exp-img" src="" alt="Animal">
        <div class="name" id="exp-name">Cargando...</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="prevAnimal()">◀ Anterior</button>
      <button class="btn sound-btn" onclick="playCurrentSound()">🔊 Escuchar</button>
      <button class="btn" onclick="nextAnimal()">Siguiente ▶</button>
    </div>
  </div>

  <!-- INSTANCIA 2: JUEGO -->
  <div id="instance2" class="instance-container">
    <div class="game-header">
      <h2>¿Qué animal hace este sonido?</h2>
      <div class="progress" id="game-progress">Adivinados: 0 / 8</div>
    </div>

    <button class="btn sound-btn" style="margin-bottom: 10px;" onclick="playTargetSound()">
      🔊 Escuchar Sonido De Nuevo
    </button>

    <div class="options-grid" id="options-grid"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    // Configuración apuntando a los archivos locales en la carpeta "audio/"
   const ANIMALS = [
      {
        id: 'perro',
        name: 'Perro',
        image: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=600&q=80',
        sound: 'perro.wav'
      },
      {
        id: 'gato',
        name: 'Gato',
        image: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&q=80',
        sound: 'gato.wav'
      },
      {
        id: 'oveja',
        name: 'Oveja',
        image: 'https://images.unsplash.com/photo-1484557985045-edf25e08da73?auto=format&fit=crop&w=600&q=80',
        sound: 'oveja.wav'
      },
      {
        id: 'leon',
        name: 'León',
        image: 'https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?auto=format&fit=crop&w=600&q=80',
        sound: 'leon.wav'
      },
      {
        id: 'pollito',
        name: 'Pollito',
        image: 'https://images.unsplash.com/photo-1563281577-a7be47e20db9?auto=format&fit=crop&w=600&q=80',
        sound: 'pollito.wav' // <-- ¡Corregido! Se eliminó "audio/"
      },
      {
        id: 'gallina',
        name: 'Gallina',
        image: 'https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?auto=format&fit=crop&w=600&q=80',
        sound: 'gallina.wav'
      },
      {
        id: 'vaca',
        name: 'Vaca',
        image: 'https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=600&q=80',
        sound: 'vaca.wav'
      },
      {
        id: 'cerdo',
        name: 'Cerdo',
        image: 'https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=600&q=80',
        sound: 'cerdo.wav'
      }
    ];

    let currentAudio = null;

    // --- LÓGICA INSTANCIA 1 ---
    let currentIndex = 0;

    function updateExplorer() {
      const animal = ANIMALS[currentIndex];
      document.getElementById('exp-img').src = animal.image;
      document.getElementById('exp-name').textContent = animal.name;
    }

    function playCurrentSound() {
      playSound(ANIMALS[currentIndex].sound);
    }

    function nextAnimal() {
      currentIndex = (currentIndex + 1) % ANIMALS.length;
      updateExplorer();
      playCurrentSound();
    }

    function prevAnimal() {
      currentIndex = (currentIndex - 1 + ANIMALS.length) % ANIMALS.length;
      updateExplorer();
      playCurrentSound();
    }

    // --- LÓGICA INSTANCIA 2 ---
    let remainingAnimals = [];
    let currentTarget = null;
    let isBlockClicked = false;
    let score = 0;

    function initGame() {
      remainingAnimals = [...ANIMALS];
      score = 0;
      nextRound();
    }

    function nextRound() {
      isBlockClicked = false;
      document.getElementById('feedback').textContent = '';
      
      if (remainingAnimals.length === 0) {
        document.getElementById('feedback').innerHTML = '🎉 ¡Felicidades! Has adivinado todos los sonidos. ¡Reiniciando ronda!';
        setTimeout(() => {
          initGame();
        }, 3000);
        return;
      }

      document.getElementById('game-progress').textContent = `Adivinados: ${score} / ${ANIMALS.length}`;

      const targetIndex = Math.floor(Math.random() * remainingAnimals.length);
      currentTarget = remainingAnimals[targetIndex];

      const otherAnimals = ANIMALS.filter(a => a.id !== currentTarget.id);
      const shuffledOthers = [...otherAnimals].sort(() => 0.5 - Math.random());
      const options = [currentTarget, ...shuffledOthers.slice(0, 3)].sort(() => 0.5 - Math.random());

      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';
      
      options.forEach(animal => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.innerHTML = `<img src="${animal.image}" alt="${animal.name}">`;
        card.onclick = () => checkAnswer(animal, card);
        grid.appendChild(card);
      });

      setTimeout(() => {
        playTargetSound();
      }, 300);
    }

    function playTargetSound() {
      if (currentTarget) {
        playSound(currentTarget.sound);
      }
    }

    function checkAnswer(selectedAnimal, cardElement) {
      if (isBlockClicked) return;

      if (selectedAnimal.id === currentTarget.id) {
        isBlockClicked = true;
        cardElement.classList.add('correct');
        document.getElementById('feedback').textContent = '✨ ¡Correcto!';
        document.getElementById('feedback').style.color = '#4CAF50';
        
        remainingAnimals = remainingAnimals.filter(a => a.id !== currentTarget.id);
        score++;

        setTimeout(() => {
          nextRound();
        }, 1500);
      } else {
        cardElement.classList.add('wrong');
        document.getElementById('feedback').textContent = '❌ Intenta de nuevo...';
        document.getElementById('feedback').style.color = '#F44336';
      }
    }

    // --- REPRODUCCIÓN DE AUDIO ---
    function playSound(url) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = new Audio(url);
      currentAudio.play().catch(e => console.log('Error al reproducir audio:', e));
    }

    // --- CAMBIO DE INSTANCIAS ---
    function switchInstance(instanceNum) {
      if (currentAudio) currentAudio.pause();

      const btn1 = document.querySelectorAll('.nav-btn')[0];
      const btn2 = document.querySelectorAll('.nav-btn')[1];
      const inst1 = document.getElementById('instance1');
      const inst2 = document.getElementById('instance2');

      if (instanceNum === 1) {
        btn1.classList.add('active');
        btn2.classList.remove('active');
        inst1.classList.add('active');
        inst2.classList.remove('active');
        updateExplorer();
      } else {
        btn2.classList.add('active');
        btn1.classList.remove('active');
        inst2.classList.add('active');
        inst1.classList.remove('active');
        initGame();
      }
    }

    updateExplorer();
  </script>
</body>
</html>
